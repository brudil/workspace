name: PR Checks

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: git config --global user.name "CI" && git config --global user.email "ci@test"

      - run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI is built and committed
        run: |
          npm ci --prefix web
          npm run build --prefix web
          if [ -n "$(git status --porcelain internal/web/dist)" ]; then
            echo "internal/web/dist is out of date: run just build and commit it"
            git status --porcelain internal/web/dist
            exit 1
          fi

      - run: go build ./...

      - run: go test ./...
